# Cloud Run service that pulls a subscription.
#
# The runtime service account is the workload identity: leave credentials unset.
# CPU throttling must stay off and at least one instance must stay up, otherwise
# StreamingPull is frozen between HTTP requests.
#
# Prefer a worker pool when it is available in the universe; it does not need
# an HTTP port. This service manifest exists because every Cloud Run service
# must listen on $PORT. The process does that automatically.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pubsub-printer
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: pubsub-printer@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPO/pubsub-printer:latest
          ports:
            - containerPort: 8080
              name: http1
          env:
            - name: PUBSUB_PROJECT_ID
              value: s3ns:my-project
            - name: PUBSUB_SUBSCRIPTION
              value: events
            - name: GOOGLE_CLOUD_UNIVERSE_DOMAIN
              value: s3nsapis.fr
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
